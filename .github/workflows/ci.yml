name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure repository-local Git identity
        run: |
          git config user.name "Mohamed Islem Rezzag Baara"
          git config user.email "Islem-Rezzag@users.noreply.github.com"

      - name: Run QA development environment
        run: pnpm qa:dev

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check formatting
        run: pnpm format:check

      - name: Validate control plane
        run: python scripts/validate-control-plane.py

      - name: Run control-plane tests
        run: python -m pytest tests/test_control_plane_bootstrap.py

  infra-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose config
        run: docker compose config

      - name: Start local Postgres
        run: docker compose up -d postgres

      - name: Wait for Postgres health
        run: |
          for attempt in {1..30}; do
            container_id="$(docker compose ps -q postgres)"
            if [ -n "$container_id" ]; then
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
              if [ "$status" = "healthy" ]; then
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                docker compose logs postgres
                exit 1
              fi
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Run mandatory isolated PostgreSQL17 ledger storage acceptance
        env:
          LEDGER_STORAGE_TEST_ADMIN_URL: postgres://causalledger:causalledger_local_password@127.0.0.1:5432/causalledger_dev
          LEDGER_STORAGE_TEST_DISPOSABLE: YES_M04_05_SYNTHETIC_ONLY
        run: pnpm test:ledger-storage

      - name: Clean up Compose
        if: always()
        run: docker compose down -v
